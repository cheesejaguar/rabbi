<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="light dark">
    <title>rebbe.dev | Admin</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="/static/brand.css?v=2">
    <link rel="stylesheet" href="/static/admin.css?v=1">
    <script src="/static/theme.js?v=1"></script>
    <script src="/static/admin.js?v=1" defer></script>
</head>
<body>
    <a class="skip-link" href="#adminMain">Skip to admin content</a>

    <header class="admin-header">
        <div class="admin-header-inner">
            <a class="brand-lockup" href="/" aria-label="rebbe.dev chat">
                <img src="/static/assets/brand/braided-r.svg" alt="" width="34" height="34">
                <span>rebbe<span class="brand-wordmark-dot">.dev</span></span>
            </a>
            <div class="admin-context" aria-label="Current workspace">
                <span class="context-name">Administration</span>
            </div>
            <div class="header-actions">
                <button class="theme-cycle" type="button" data-theme-cycle>
                    <span class="ph-icon ph-sun" aria-hidden="true"></span>
                    <span class="theme-label" data-theme-label>system</span>
                </button>
                <a class="back-link" href="/">
                    <span class="ph-icon ph-arrow-right back-link-icon" aria-hidden="true"></span>
                    <span>Back to chat</span>
                </a>
            </div>
        </div>
    </header>

    <div class="admin-shell">
        <aside class="admin-rail" aria-label="Admin navigation">
            <div class="rail-heading">
                <p class="rail-note">Review product health and sensitive queues.</p>
            </div>
            <nav id="tabs" class="admin-tabs" role="tablist" aria-label="Admin views" aria-orientation="vertical">
                <button id="tab-overview" type="button" role="tab" aria-selected="true" aria-controls="content" tabindex="0" data-tab="overview" class="active">
                    <span class="tab-index numeric">01</span><span>Overview</span>
                </button>
                <button id="tab-users" type="button" role="tab" aria-selected="false" aria-controls="content" tabindex="-1" data-tab="users">
                    <span class="tab-index numeric">02</span><span>Users</span>
                </button>
                <button id="tab-flagged" type="button" role="tab" aria-selected="false" aria-controls="content" tabindex="-1" data-tab="flagged">
                    <span class="tab-index numeric">03</span><span>Crisis queue</span>
                </button>
                <button id="tab-feedback" type="button" role="tab" aria-selected="false" aria-controls="content" tabindex="-1" data-tab="feedback">
                    <span class="tab-index numeric">04</span><span>Feedback</span>
                </button>
                <button id="tab-errors" type="button" role="tab" aria-selected="false" aria-controls="content" tabindex="-1" data-tab="errors">
                    <span class="tab-index numeric">05</span><span>Errors</span>
                </button>
                <button id="tab-purchases" type="button" role="tab" aria-selected="false" aria-controls="content" tabindex="-1" data-tab="purchases">
                    <span class="tab-index numeric">06</span><span>Purchases</span>
                </button>
                <button id="tab-sponsorships" type="button" role="tab" aria-selected="false" aria-controls="content" tabindex="-1" data-tab="sponsorships">
                    <span class="tab-index numeric">07</span><span>Sponsorships</span>
                </button>
                <button id="tab-analytics" type="button" role="tab" aria-selected="false" aria-controls="content" tabindex="-1" data-tab="analytics">
                    <span class="tab-index numeric">08</span><span>Analytics</span>
                </button>
                <button id="tab-audit" type="button" role="tab" aria-selected="false" aria-controls="content" tabindex="-1" data-tab="audit">
                    <span class="tab-index numeric">09</span><span>Audit log</span>
                </button>
            </nav>
            <div class="rail-footer">
                <span class="rail-status-dot" aria-hidden="true"></span>
                <span>Role enforced by server</span>
            </div>
        </aside>

        <main id="adminMain" class="admin-main" tabindex="-1">
            <div class="mobile-view-control">
                <label for="mobileViewSelect">Admin view</label>
                <select id="mobileViewSelect">
                    <option value="overview">Overview</option>
                    <option value="users">Users</option>
                    <option value="flagged">Crisis queue</option>
                    <option value="feedback">Feedback</option>
                    <option value="errors">Errors</option>
                    <option value="purchases">Purchases</option>
                    <option value="sponsorships">Sponsorships</option>
                    <option value="analytics">Analytics</option>
                    <option value="audit">Audit log</option>
                </select>
            </div>

            <div class="view-heading">
                <div>
                    <h1 id="viewTitle">Overview</h1>
                </div>
                <p id="viewDescription" class="view-description">Usage, revenue, quality, and estimated model costs.</p>
            </div>

            <div class="error-banner" id="errorBanner" role="alert" hidden></div>
            <div id="adminStatus" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
            <section id="content" role="tabpanel" aria-labelledby="tab-overview" aria-busy="true">
                <div class="loading-state" role="status">
                    <span class="loading-mark" aria-hidden="true"></span>
                    <span>Loading overview</span>
                </div>
            </section>
        </main>
    </div>

    <dialog id="convoDialog" class="admin-dialog" aria-labelledby="convoDialogTitle">
        <div class="dialog-frame">
            <div class="dialog-header">
                <div>
                    <h2 id="convoDialogTitle" dir="auto">Conversation</h2>
                </div>
                <button class="icon-button" type="button" data-dialog-close="convoDialog" aria-label="Close conversation dialog">
                    <span class="ph-icon ph-x" aria-hidden="true"></span>
                </button>
            </div>
            <div id="convoContent" class="dialog-content"></div>
            <div class="dialog-actions">
                <button class="button secondary" type="button" data-dialog-close="convoDialog">Close</button>
            </div>
        </div>
    </dialog>

    <dialog id="actionDialog" class="admin-dialog action-dialog" aria-labelledby="actionDialogTitle" aria-describedby="actionDialogDescription">
        <form id="actionForm" class="dialog-frame" novalidate>
            <div class="dialog-header">
                <div>
                    <h2 id="actionDialogTitle">Confirm action</h2>
                </div>
                <button class="icon-button" type="button" data-dialog-close="actionDialog" aria-label="Close action dialog">
                    <span class="ph-icon ph-x" aria-hidden="true"></span>
                </button>
            </div>
            <p id="actionDialogDescription" class="dialog-description" dir="auto"></p>
            <div id="actionFields" class="action-fields"></div>
            <div id="actionState" class="action-state" role="status" aria-live="polite" aria-atomic="true"></div>
            <div class="dialog-actions">
                <button id="actionCancel" class="button secondary" type="button" data-dialog-close="actionDialog">Cancel</button>
                <button id="actionSubmit" class="button primary" type="submit">Continue</button>
            </div>
        </form>
    </dialog>
</body>
</html>
