name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --dev

      - name: Install Chromium for browser tests
        run: uv run playwright install --with-deps chromium

      # There are ~46 pre-existing lint findings on the codebase today
      # (mostly unused imports in tests, plus a few unused locals and
      # import-order issues). continue-on-error is intentional for now so
      # this step is visible in CI without blocking merges on an unrelated
      # cleanup; flip to false once the existing findings are triaged/fixed.
      - name: Lint with ruff
        run: uv run ruff check backend/
        continue-on-error: true

      - name: Run tests with coverage
        run: |
          uv run pytest backend/tests/ \
            --ignore=backend/tests/test_frontend_browser.py \
            --cov=backend/app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=60 \
            -v

      - name: Run browser interaction tests
        run: uv run pytest backend/tests/test_frontend_browser.py --browser chromium -v

      # pip-audit scans installed dependencies for known vulnerabilities.
      # continue-on-error is intentional: this is being introduced for
      # visibility first so findings can be triaged (e.g. false positives,
      # transitive deps with no fix available yet) before it's allowed to
      # block merges. Flip this to false once the initial findings are
      # reviewed and either fixed or explicitly accepted/ignored.
      - name: Audit dependencies with pip-audit
        run: uvx pip-audit
        continue-on-error: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: rebbe:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
