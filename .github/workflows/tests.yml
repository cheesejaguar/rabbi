name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --dev

      # The browser is ~115MB and changes only when the pinned Playwright
      # version does, so it is keyed on that version rather than on uv.lock.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(uv run playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium for browser tests
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: uv run playwright install --with-deps chromium

      # The system libraries Chromium links against live outside the cached
      # browser directory, so they are installed on a cache hit too. This is a
      # fast apt-only path that skips the browser download.
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: uv run playwright install-deps chromium

      # There are ~46 pre-existing lint findings on the codebase today
      # (mostly unused imports in tests, plus a few unused locals and
      # import-order issues). continue-on-error is intentional for now so
      # this step is visible in CI without blocking merges on an unrelated
      # cleanup; flip to false once the existing findings are triaged/fixed.
      - name: Lint with ruff
        run: uv run ruff check backend/
        continue-on-error: true

      - name: Run tests with coverage
        run: |
          uv run pytest backend/tests/ \
            --ignore=backend/tests/test_frontend_browser.py \
            --ignore=backend/tests/test_frontend_integration.py \
            --cov=backend/app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=60 \
            -v

      # Deliberately blocking, unlike the lint and audit steps above: these
      # cover accessibility, contrast, responsive reflow, and the payment and
      # admin surfaces, and a regression in any of them should stop a merge.
      - name: Run browser interaction tests
        run: |
          uv run pytest \
            backend/tests/test_frontend_browser.py \
            backend/tests/test_frontend_integration.py \
            --browser chromium -v

      # pip-audit scans installed dependencies for known vulnerabilities.
      # continue-on-error is intentional: this is being introduced for
      # visibility first so findings can be triaged (e.g. false positives,
      # transitive deps with no fix available yet) before it's allowed to
      # block merges. Flip this to false once the initial findings are
      # reviewed and either fixed or explicitly accepted/ignored.
      - name: Audit dependencies with pip-audit
        run: uvx pip-audit
        continue-on-error: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: rebbe:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
